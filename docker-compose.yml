version: "3.9"

services:
  swoole:
    build: .
    container_name: swoole_app
    working_dir: /var/www/html/
    volumes:
      - ./:/var/www/html/
      - ./xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    network_mode: "host"
    #ports:
    #  - "9501:9501"
    command: ["php", "/var/www/html/src/main.php"]
    restart: "no"
    stop_grace_period: 60s
    # Swoole читает soft nofile при запуске PHP, до настройки max_connection.
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    environment:
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
    extra_hosts:
      - "host.docker.internal:host-gateway"
