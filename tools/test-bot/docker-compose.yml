services:
  queue-bot:
    build:
      context: .
    container_name: sp_game_test_bot
    restart: unless-stopped
    environment:
      BOT_API_HOST: 0.0.0.0
      BOT_API_PORT: 8095
      GAME_WS_URL: ${GAME_WS_URL:-ws://host.docker.internal:9501/}
      SP_GAME_LOGIN: ${SP_GAME_LOGIN:-}
      SP_GAME_PASSWORD: ${SP_GAME_PASSWORD:-}
      CABINET_API_URL: ${CABINET_API_URL:-https://cabinet.sp-game.ru}
      SP_GAME_CABINET_EMAIL: ${SP_GAME_CABINET_EMAIL:-}
      GAME_WORLD_ID: ${GAME_WORLD_ID:-sp-game-dev}
      BOT_API_TOKEN: ${BOT_API_TOKEN:-change-me}
      BOT_REQUEST_TIMEOUT: ${BOT_REQUEST_TIMEOUT:-15}
      BOT_MAX_RUN_SECONDS: ${BOT_MAX_RUN_SECONDS:-3600}
      BOT_LOG_DIR: /app/data/runs
      BOT_STATE_FILE: ${BOT_STATE_FILE:-/app/data/state.json}
      BOT_RETRY_INITIAL_SECONDS: ${BOT_RETRY_INITIAL_SECONDS:-5}
      BOT_RETRY_MAX_SECONDS: ${BOT_RETRY_MAX_SECONDS:-300}
      BOT_RETRY_BEFORE_QUESTION: ${BOT_RETRY_BEFORE_QUESTION:-5}
      BOT_SUPERVISOR_INTERVAL_SECONDS: ${BOT_SUPERVISOR_INTERVAL_SECONDS:-15}
      BOT_SUPERVISOR_STARTUP_SECONDS: ${BOT_SUPERVISOR_STARTUP_SECONDS:-45}
      BOT_SUPERVISOR_FAILURES: ${BOT_SUPERVISOR_FAILURES:-3}
      BOT_SUPERVISOR_TERMINATE_SECONDS: ${BOT_SUPERVISOR_TERMINATE_SECONDS:-25}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BOT_API_PORT:-8095}:8095"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import os, urllib.request; request = urllib.request.Request(\"http://127.0.0.1:8095/health\", headers={\"X-Bot-Token\": os.environ[\"BOT_API_TOKEN\"]}); assert urllib.request.urlopen(request, timeout=5).status == 200'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  browser:
    image: selenium/standalone-chromium:latest
    container_name: sp_game_test_browser
    restart: unless-stopped
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 86400
      SE_SCREEN_WIDTH: 1440
      SE_SCREEN_HEIGHT: 1000
      SE_SCREEN_DEPTH: 24
      SE_VNC_NO_PASSWORD: "0"
      SE_VNC_PASSWORD: ${BROWSER_VNC_PASSWORD:-change-me}
    ports:
      - "${BROWSER_BIND_ADDRESS:-127.0.0.1}:7900:7900"
      - "127.0.0.1:${BROWSER_WEBDRIVER_PORT:-4444}:4444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
